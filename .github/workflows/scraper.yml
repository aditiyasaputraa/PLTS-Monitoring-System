name: PLTS Automated Scraper

on:
  schedule:
    # Runs every 15 minutes automatically in the cloud
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-cron.txt'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r backend/requirements-cron.txt

      - name: Configure DNS & Hosts for Vendor Endpoints
        run: |
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf
          echo "119.8.160.213 sg5.fusionsolar.huawei.com" | sudo tee -a /etc/hosts
          echo "47.242.3.236 energy.kehua.com" | sudo tee -a /etc/hosts

      - name: Run PLTS Scraper & Save to Supabase
        env:
          PYTHONPATH: backend
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          HUAWEI_USERNAME: ${{ secrets.HUAWEI_USERNAME }}
          HUAWEI_PASSWORD: ${{ secrets.HUAWEI_PASSWORD }}
          KEHUA_USERNAME: ${{ secrets.KEHUA_USERNAME }}
          KEHUA_PASSWORD: ${{ secrets.KEHUA_PASSWORD }}
          KEHUA_USERNAME_2: ${{ secrets.KEHUA_USERNAME_2 }}
          KEHUA_PASSWORD_2: ${{ secrets.KEHUA_PASSWORD_2 }}
          KEHUA_ACCOUNTS_JSON: ${{ secrets.KEHUA_ACCOUNTS_JSON }}
          HUAWEI_COOKIES_JSON: ${{ secrets.HUAWEI_COOKIES_JSON }}
          KEHUA_COOKIES_JSON: ${{ secrets.KEHUA_COOKIES_JSON }}
        run: |
          python backend/run_cron.py
