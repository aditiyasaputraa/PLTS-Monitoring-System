name: PLTS Automated Scraper

on:
  schedule:
    # 05:30 & 05:45 WIB (22:30, 22:45 UTC)
    - cron: '30,45 22 * * *'
    # 06:00 - 17:45 WIB setiap 15 menit (23:00 - 10:45 UTC)
    - cron: '*/15 23,0-10 * * *'
    # 18:00, 18:15 & 18:30 WIB (11:00, 11:15, 11:30 UTC)
    - cron: '0,15,30 11 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-cron.txt'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r backend/requirements-cron.txt

      - name: Configure DNS & Hosts for Vendor Endpoints
        run: |
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf
          echo "119.8.160.213 sg5.fusionsolar.huawei.com" | sudo tee -a /etc/hosts
          echo "47.242.3.236 energy.kehua.com" | sudo tee -a /etc/hosts

      - name: Run PLTS Scraper & Save to Supabase
        env:
          PYTHONPATH: backend
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          HUAWEI_USERNAME: ${{ secrets.HUAWEI_USERNAME }}
          HUAWEI_PASSWORD: ${{ secrets.HUAWEI_PASSWORD }}
          HUAWEI_USERNAME_2: ${{ secrets.HUAWEI_USERNAME_2 }}
          HUAWEI_PASSWORD_2: ${{ secrets.HUAWEI_PASSWORD_2 }}
          HUAWEI_USERNAME_3: ${{ secrets.HUAWEI_USERNAME_3 }}
          HUAWEI_PASSWORD_3: ${{ secrets.HUAWEI_PASSWORD_3 }}
          HUAWEI_ACCOUNTS_JSON: ${{ secrets.HUAWEI_ACCOUNTS_JSON }}
          KEHUA_USERNAME: ${{ secrets.KEHUA_USERNAME }}
          KEHUA_PASSWORD: ${{ secrets.KEHUA_PASSWORD }}
          KEHUA_USERNAME_2: ${{ secrets.KEHUA_USERNAME_2 }}
          KEHUA_PASSWORD_2: ${{ secrets.KEHUA_PASSWORD_2 }}
          KEHUA_USERNAME_3: ${{ secrets.KEHUA_USERNAME_3 }}
          KEHUA_PASSWORD_3: ${{ secrets.KEHUA_PASSWORD_3 }}
          KEHUA_ACCOUNTS_JSON: ${{ secrets.KEHUA_ACCOUNTS_JSON }}
          HUAWEI_COOKIES_JSON: ${{ secrets.HUAWEI_COOKIES_JSON }}
          KEHUA_COOKIES_JSON: ${{ secrets.KEHUA_COOKIES_JSON }}
          ENABLE_SMA: ${{ secrets.ENABLE_SMA || 'true' }}
          SMA_USERNAME: ${{ secrets.SMA_USERNAME }}
          SMA_PASSWORD: ${{ secrets.SMA_PASSWORD }}
          SMA_USERNAME_2: ${{ secrets.SMA_USERNAME_2 }}
          SMA_PASSWORD_2: ${{ secrets.SMA_PASSWORD_2 }}
          SMA_USERNAME_3: ${{ secrets.SMA_USERNAME_3 }}
          SMA_PASSWORD_3: ${{ secrets.SMA_PASSWORD_3 }}
          SMA_ACCOUNTS_JSON: ${{ secrets.SMA_ACCOUNTS_JSON }}
          SMA_COOKIES_JSON: ${{ secrets.SMA_COOKIES_JSON }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          python backend/run_cron.py
